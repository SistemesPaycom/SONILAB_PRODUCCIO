      - link "large (v3)" [ref=f1e506] [cursor=pointer]:
        - /url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin
      - text: "Requirements for \"CPP cuBLAS\": https://developer.nvidia.com/cuda-downloads"
      - text: "Requirements: Requirements vary depending of Whisper engine and model. The large model can require up to 16 GB of ram."
      - text: Whisper CPP/Const-me require a newer CPU with AVX instruction set.
      - text: If you do not want to install Python, Purfview has Whisper OpenAI and Whisper CTranslate2
      - link "compiled binaries" [ref=f1e507] [cursor=pointer]:
        - /url: https://github.com/Purfview/whisper-standalone-win/releases
      - text: .
      - text: "Note: A whisper log is written to the file \"whisper_log.txt\" in the \"SE data folder\" (press Ctrl+Alt+Shift+D in the SE main window to open the SE data folder)."
      - text: "Note: You can press F2 in the Whisper windows too see the actual command line output during transcribe."
      - text: "Note: All Python Whisper can be very difficult to install, so follow the authors installation instructions very carefully. It's probably best to use Python 3.10 and often different Whisper versions cannot requires different versions of the same packages so do use something like"
      - link "Anaconda" [ref=f1e508] [cursor=pointer]:
        - /url: https://www.anaconda.com/download
      - text: .
      - generic [ref=f1e509]: Audio to text (Vosk/Kaldi)
      - text: can convert speech to text for more that 20 languages.
      - text: The resulting quality depends on how clear the speech is and how good the model is.
      - text: Batch conversion is available and you can also use Audio to text on selected lines in the list view via context menu (right click).
      - img "Audio to text" [ref=f1e510]
      - text: Audio to text (Vosk/Kaldi) requires
      - link "libvosk" [ref=f1e511] [cursor=pointer]:
        - /url: https://github.com/alphacep/vosk-api
      - text: and
      - link "audio to text models" [ref=f1e512] [cursor=pointer]:
        - /url: https://alphacephei.com/vosk/models
      - text: as well as
      - link "FFmpeg" [ref=f1e513] [cursor=pointer]:
        - /url: https://ffmpeg.org
      - text: .
      - text: "libvosk, FFmpeg and models download should be handled by the SE UI, and the folder structure will be like this:"
      - list [ref=f1e514]:
        - listitem [ref=f1e515]: "FFmpeg: [SE Data folder]\\ffmpeg (should contain ffmpeg.exe)"
        - listitem [ref=f1e516]: "libvosk: [SE Data folder]\\Vosk (should contain libvosk.dll etc.)"
        - listitem [ref=f1e517]: "models: [SE Data folder]\\Vosk\\[model name] (should contain final.mdl in the \"am\" folder)"
      - img "Audio to text" [ref=f1e518]
      - text: On Linux you need to
      - link "install vosk" [ref=f1e519] [cursor=pointer]:
        - /url: https://github.com/SubtitleEdit/subtitleedit/issues/6071
      - text: with "pip3 install vosk" and setup a symlink file like "sudo ln -s /usr/local/lib/python3.8/dist-packages/vosk/libvosk.so ~/Downloads/SubtitleEdit/libvosk.so".
      - separator [ref=f1e520]
      - heading "Text to speech" [level=2] [ref=f1e521]
      - text: Text to speech (TTS) is accessible via Video -> Text to speech and add to video... or you can make a custom shortcut.
      - text: Note that split sentences should be merged before using TTS. Formatting should also be removed.
      - text: CPS (characters per second) should not be too high or the audio will sound bad (too fast).
      - text: Will convert all texts from a subtitle and convert to audio and optionally add this new audio track to your video file.
      - text: For ASSA format, you can assign a voice to each actor.
      - link "Piper TTS" [ref=f1e523] [cursor=pointer]:
        - /url: https://github.com/rhasspy/piper
      - text: ": Requires an in-program download for Windows + requires model downloads. Good quality and speed. Includes many voices."
      - link "Tortoise TTS" [ref=f1e525] [cursor=pointer]:
        - /url: https://github.com/neonbjb/tortoise-tts
      - text: ": Requires an installation via Python. Good but very slow, especially without CUDA."
      - link "Coqui AI TTS" [ref=f1e527] [cursor=pointer]:
        - /url: https://github.com/coqui-ai/TTS
      - text: ": SE will run against the api (tts-server), see"
      - link "the docker images" [ref=f1e528] [cursor=pointer]:
        - /url: https://docs.coqui.ai/en/latest/docker_images.html
      - text: page.
      - text: Only one voice at a time.
      - link "ElevenLabs" [ref=f1e530] [cursor=pointer]:
        - /url: https://elevenlabs.io/api
      - text: ": Online. Requires an API key. Good quality and many voice."
      - text: "Microsoft Speech Synthesizer TTS: Old, fast, and very robotic. Included with Windows (probably)."
      - separator [ref=f1e531]
      - heading "Subtitle Edit command line conversion" [level=2] [ref=f1e532]
      - text: Subtitle Edit can do command line conversion between formats listed in the main window format drop down list.
      - text: "Syntax: SubtitleEdit /convert \"pattern\" \"name-of-format-without-spaces\" [/encoding:?] [/fps:?] [/outputfolder:?]:"
      - text: "Example 1:"
      - generic [ref=f1e533]: SubtitleEdit /convert sub1.srt sami
      - text: "Result: Will convert sub1.srt to sub1.sub to SAMI format"
      - text: "Example 2:"
      - generic [ref=f1e534]: SubtitleEdit /convert *.srt adobeencore
      - text: "Result: Will convert all .srt files to Adobe Encore format"
      - text: "Example 3:"
      - generic [ref=f1e535]: SubtitleEdit /convert *.srt adobeencore /encoding:windows-1252
      - text: "Result: Same as above but using windows-1252 file encoding (see"
      - link "Info.Name list" [ref=f1e536] [cursor=pointer]:
        - /url: http://msdn.microsoft.com/en-us/library/system.text.encodinginfo.getencoding.aspx
      - text: for more encodings)
      - text: "Example 4:"
      - generic [ref=f1e537]: SubtitleEdit /convert a.sub subrip /fps:25
      - text: "Result: Converts frame based a.sub to time based a.srt via a frame rate of 25"
      - text: "Example 5:"
      - generic [ref=f1e538]: SubtitleEdit /convert a.sub subrip /outputfolder:C:\Temp
      - text: "Result: Converts a.sub to C:\\Temp\\a.srt"
      - text: "Example 6:"
      - generic [ref=f1e539]: SubtitleEdit /convert a.sub CustomText:MyFormat
      - text: "Result: Converts a.sub to a.txt in a custom format named \"MyFormat\""
      - text: "To list supported formats:"
      - generic [ref=f1e540]: SubtitleEdit /convert /list
      - text: "Result: Show the more than 300 supported formats in command line conversion!"
      - separator [ref=f1e541]
      - heading "Portable version and VLC" [level=2] [ref=f1e542]
      - text: To use Subtitle Edit portable with VLC portable, download VLC portable (at least version 1.1.0, like
      - link "VLC 3.0.8 64-bit" [ref=f1e543] [cursor=pointer]:
        - /url: https://get.videolan.org/vlc/3.0.8/win64/vlc-3.0.8-win64.exe
      - text: or
      - link "VLC 3.0.8 32-bit" [ref=f1e544] [cursor=pointer]:
        - /url: https://get.videolan.org/vlc/3.0.8/win32/vlc-3.0.8-win32.exe
      - text: ).
      - text: Now you can unpack to a sub folder in the Subtitle Edit folder called "VLC" or go to Options -> Settings -> Video player and browse to VLC portable version.
      - text: "Note: You need VLC 64-bit on 64-bit operating systems, and VLC 32-bit on 32-bit operating systems."
      - separator [ref=f1e545]
      - heading "Make your own plugin" [level=2] [ref=f1e546]
      - text: If you can code C# or VB.net you can make your own plugins for SE (SE 3.3 and later).
      - text: You can
      - link "visit the GitHub plugin page" [ref=f1e547] [cursor=pointer]:
        - /url: https://github.com/SubtitleEdit/plugins
      - text: for more information and download.
      - text: "\"Haxor\" is a very basic example."
      - text: "\"Fix Hyphens\" is a more complete example with a form and some basic helper classes."
      - text: "At the moment it is possible to use plugins here: File, Tools, Sync, Translate, and \"Spell check\"."
      - text: Compile to "Any CPU" and not x86 or x64.
      - separator [ref=f1e548]
      - heading "Subtitle Edit on Linux" [level=2] [ref=f1e549]
      - text: Even though Subtitle Edit is a Windows program, it runs (mostly) well on Linux via
      - link "Mono" [ref=f1e550] [cursor=pointer]:
        - /url: https://www.mono-project.com/docs/gui/winforms/
      - text: .
      - text: Note that a dotnet
      - link "CLI version" [ref=f1e551] [cursor=pointer]:
        - /url: https://github.com/SubtitleEdit/subtitleedit-cli
      - text: is also available (no mono).
      - img "SE running on Linux" [ref=f1e552]
      - text: Download the portable version of SE (and not the installer).
      - text: "Packages required for Ubuntu based distros:"
      - list [ref=f1e553]:
        - listitem [ref=f1e554]: sudo apt-get install mono-complete
        - listitem [ref=f1e555]: sudo apt-get install libhunspell-dev
        - listitem [ref=f1e556]: sudo apt-get install libmpv-dev (libmpv.so)
        - listitem [ref=f1e557]: sudo apt-get install tesseract-ocr
        - listitem [ref=f1e558]: sudo apt-get install vlc (already installed on some distros, SE uses (libvlc.so))
        - listitem [ref=f1e559]: sudo apt-get install ffmpeg (already installed on some distros)
      - text: "Packages required for Arch based distros (like Manjaro):"
      - list [ref=f1e560]:
        - listitem [ref=f1e561]: sudo pacman -S mono
        - listitem [ref=f1e562]: sudo pacman -S mpv
        - listitem [ref=f1e563]: sudo pacman -S hunspell
        - listitem [ref=f1e564]: sudo pacman -S ttf-dejavu (Unicode font)
        - listitem [ref=f1e565]: sudo pacman -S tesseract
        - listitem [ref=f1e566]: sudo pacman -S tesseract-data-eng (or install via "sudo mono SubtitleEdit.exe")
      - text: "Packages required for Fedora:"
      - list [ref=f1e567]:
        - listitem [ref=f1e568]: sudo dnf -y install mono-complete hunspell dejavu-sans-fonts tesseract tesseract-langpack-eng vlc vlc-extras ffmpeg
      - generic [ref=f1e569]:
        - text: "Fedora: To use libmpv you will need to enable"
        - link "rpmfusion" [ref=f1e570] [cursor=pointer]:
          - /url: https://docs.fedoraproject.org/en-US/quick-docs/setup_rpmfusion/
        - text: and install "mpv mpv-libs" packages + Change "<MpvVideoOutputLinux />" to "<MpvVideoOutputLinux>x11</MpvVideoOutputLinux>" in Settings.xml.
        - text: "To use spell check you will need to make a symlink link like this: sudo ln -s /usr/lib64/libhunspell-1.7.so.0 ~/Downloads/SubtitleEdit/libhunspell.so"
      - text: After unpacking SE and installing the packages, you can start SE by running "mono SubtitleEdit.exe" in a terminal.
      - text: (The "Tesseract302" folder and the two hunspell dll files can be deleted as they are for Windows only.)
      - text: Tesseract languages must be installed via a package - e.g. on Ubuntu "sudo apt-get install tesseract-ocr-eng".
      - text: "Note that these lib are required (a symlink file may be needed): libc.so.6, libdl.so (libdl.so.2 in SE 3.5.16) Adding a missing symlink for libvlc could look like this: sudo ln -s /usr/lib/x86_64-linux-gnu/libvlc.so.5.6.0 ~Downloads/SubtitleEdit/libvlc.so"
      - text: "Known issues:"
      - list [ref=f1e571]:
        - listitem [ref=f1e572]: Setting focus on a control programmatically does not work
        - listitem [ref=f1e573]:
          - text: The letter è (and some other Unicode characters) will crash SE - read more
          - link "in this Github issue" [ref=f1e574] [cursor=pointer]:
            - /url: https://github.com/mono/mono/issues/17029
        - listitem [ref=f1e575]: Some languages like Chinese or Arabic might require a different font.
        - listitem [ref=f1e576]: Text to bitmap rendering is not working well. In image exporting try "Simple rendering" if you have problems.
        - listitem [ref=f1e577]: Winforms layout...
      - separator [ref=f1e578]
      - heading "Compiling Subtitle Edit" [level=2] [ref=f1e579]
      - text: Compiling your own version of Subtitle Edit is not that hard :)
      - text: If you don't have MS Visual Studio, then download and install
      - link "MS Visual Studio Community" [ref=f1e580] [cursor=pointer]:
        - /url: https://visualstudio.microsoft.com/vs/community
      - text: ". Then download the Subtitle Edit source code and edit the file \"SubtitleEdit.csproj\" and remove the following line:"
      - generic [ref=f1e581]: <Exec Command="%22$(SolutionDir)..\build_helpers.bat%22 rev %22$(ConfigurationName)%22" />
      - text: Open "SubtitleEdit.csproj" in Visual Studio, go to Tools -> NuGet Packet Manager -> Manage NuGet packages for Solution... - and click "Restore" (this will download required components).
      - text: Hit F5 and you should be up and running.
      - text: Now you can change/add features you want or fix my bugs - if there were any ;)
      - separator [ref=f1e582]

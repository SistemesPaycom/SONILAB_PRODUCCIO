      - separator [ref=f1e285]
      - heading "Translation (auto)" [level=2] [ref=f1e286]
      - text: Subtitle Edit can translate a subtitle by using
      - link "Google translate" [ref=f1e287] [cursor=pointer]:
        - /url: https://translate.google.com
      - text: ","
      - link "Bing Microsoft translator" [ref=f1e288] [cursor=pointer]:
        - /url: https://www.bing.com/translator
      - text: ", or"
      - link "Facebook's NLLB (No Language Left Behind)" [ref=f1e289] [cursor=pointer]:
        - /url: https://huggingface.co/docs/transformers/model_doc/nllb
      - text: .
      - text: "Automatic translation works fairly well, but translated subtitles will still need manual correction (hint: use main window"
      - link "translate mode" [ref=f1e290] [cursor=pointer]:
        - /url: "#video_modes"
      - text: ).
      - text: For Google translate you need to set up a
      - link "Google Cloud API key" [ref=f1e291] [cursor=pointer]:
        - /url: https://www.google.com/search?q=google+cloud+get+api+key
      - text: (or use the limited free quota) and for Microsoft translate you need to setup a
      - link "cognitive services 'Translator Text' key" [ref=f1e292] [cursor=pointer]:
        - /url: https://docs.microsoft.com/en-us/azure/cognitive-services/translator/translator-text-how-to-signup
      - text: and be sure to use the correct
      - link "token endpoint" [ref=f1e293] [cursor=pointer]:
        - /url: https://github.com/MicrosoftDocs/azure-docs/blob/master/includes/cognitive-services-speech-service-endpoints-token-service.md
      - text: .
      - text: Note that if you do get an API key for Google Cloud (read more
      - link "here" [ref=f1e294] [cursor=pointer]:
        - /url: https://github.com/SubtitleEdit/subtitleedit/discussions/6773#discussioncomment-5417761
      - text: ) you need to add billing info - even for the free trial period.
      - text: After getting the key, you need to paste it into the "API Key" field for "Google translate" via the menu Options - Settings - Tools.
      - text: Running Facebook's NLLB (with support for 200 languages) works via
      - link "nllb-serve" [ref=f1e295] [cursor=pointer]:
        - /url: https://github.com/thammegowda/nllb-serve
      - text: or
      - link "nllb-api" [ref=f1e296] [cursor=pointer]:
        - /url: https://github.com/winstxnhdw/nllb-api
      - text: "running as a local web API:"
      - link "nllb-serve" [ref=f1e297] [cursor=pointer]:
        - /url: https://github.com/thammegowda/nllb-serve
      - text: requires
      - link "git" [ref=f1e298] [cursor=pointer]:
        - /url: https://www.google.com/search?q=git+download
      - text: and
      - link "Python/pip" [ref=f1e299] [cursor=pointer]:
        - /url: https://www.google.com/search?q=python+download
      - text: .
      - text: "Install with these commands:"
      - generic [ref=f1e300]:
        - text: git clone https://github.com/thammegowda/nllb-serve
        - text: cd nllb-serve
        - text: pip install -e .
      - text: "Run with this command line:"
      - generic [ref=f1e301]: nllb-serve
      - link "nllb-api" [ref=f1e302] [cursor=pointer]:
        - /url: https://github.com/winstxnhdw/nllb-api
      - text: requires
      - link "Docker" [ref=f1e303] [cursor=pointer]:
        - /url: https://www.google.com/search?q=Docker+download
      - text: ". Start the docker container with this command line:"
      - generic [ref=f1e304]: docker run --rm -e SERVER_PORT=5000 -e APP_PORT=7860 -p 7860:7860 -v C:\Windows\Temp\cache.bin:/home/user/.cache ghcr.io/winstxnhdw/nllb-api:main
      - text: Running
      - link "LibreTranslate" [ref=f1e305] [cursor=pointer]:
        - /url: https://libretranslate.com/
      - text: works via a local web API (requires
      - link "Python/pip" [ref=f1e306] [cursor=pointer]:
        - /url: https://www.google.com/search?q=python+download
      - text: "):"
      - text: "Install with this commands:"
      - generic [ref=f1e307]: pip install libretranslate
      - text: "Run with this command line:"
      - generic [ref=f1e308]: libretranslate
      - text: Running
      - link "Ollama" [ref=f1e309] [cursor=pointer]:
        - /url: https://github.com/ollama/ollama
      - text: works via a large language models locally.
      - text: "Install their program and pull the model you want to use via cmd line:"
      - generic [ref=f1e310]: ollama pull llama3
      - text: Also do check the translate plug-ins, see File -> Plugins.
      - img "Create/add lines" [ref=f1e311]
      - separator [ref=f1e312]
      - heading "Fix common errors" [level=2] [ref=f1e313]
      - img "Fix common errors" [ref=f1e314]
      - text: Some subtitles have a lot of errors (often these subtitles are created using OCR software).
      - text: "\"Tools -> Fix common errors\" provides an easy way to fix a lot of these errors."
      - text: The first window shows a list of actions to fix, just tick the checkboxes you want fixed and click "Next".
      - img "Fix common errors" [ref=f1e315]
      - text: Now you can choose which fixes to apply. Selected fixes are will be remembered in future sessions.
      - text: The log tab gives an overview of what will be done - and what was not possible to fix.
      - text: The "Apply selected fixes" button applies the fixes.
      - separator [ref=f1e316]
      - generic [ref=f1e317]: Remove text for hearing impaired
      - text: Many subtitles include text for hearing impaired (also known as "
      - link "SDH" [ref=f1e318] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/Subtitle_%28captioning%29#SDH
      - text: "\" in the American movie industry which is an initialism for \"Subtitles for the deaf or hard-of-hearing\")."
      - text: For people with perfect hearing (and no noisy kids) these texts can be annoying - and easily removed with Tools -> Remove text for hearing impaired.
      - text: SE offers many options for configuring removal of text for HI and in the preview you can see what changes will be made - and skip any wrongly made removals.
      - text: You can also remove
      - link "interjections" [ref=f1e319] [cursor=pointer]:
        - /url: https://en.wikipedia.org/wiki/Interjection
      - text: and you can maintain your own interjections. Interjections are not case sensitive and SE will try to remove them by descending text length.
      - img "Remove text for hearing impaired" [ref=f1e320]
      - separator [ref=f1e321]
      - generic [ref=f1e322]: Spell check
      - text: Spell check uses
      - link "Hunspell" [ref=f1e323] [cursor=pointer]:
        - /url: http://hunspell.sourceforge.net/
      - text: (which is also used by Open/LibreOffice, Firefox, Chrome, and Opera).
      - text: Only English dictionary is included, but you can easily find more dictionaries via the toolbar menu Spell check -> Get dictionaries...!
      - text: If you download
      - link "Open Office 3.x dictionaries" [ref=f1e324] [cursor=pointer]:
        - /url: http://extensions.services.openoffice.org/en/dictionaries
      - text: with the extension .oxt, then rename to .zip, and then unpack the .dic file and the .aff file to the Subtitle Edit Dictionary folder.
      - text: "The spell check will show this window when it encounters an unknown word:"
      - img "spell check" [ref=f1e325]
      - generic [ref=f1e326]: Edit whole text
      - text: will enable editing of the whole text (and not only the current word) - for this one sub only.
      - generic [ref=f1e327]: Change all / Use always
      - text: will always change current word - also in future works (saved in the OCR Fix Replace list - take a look at Dictionaries/eng_OCRFixReplaceList.xml to learn more about this file).
      - generic [ref=f1e328]: Change / Use
      - text: will change current word just this once.
      - generic [ref=f1e329]: Add to names/noise list (case sensitive)
      - text: will remember the name in the edit text box with current casing - also in future works.
      - generic [ref=f1e330]: Add to user dictionary
      - text: will remember the word in the edit text box and not prompt for it any more - also in future works. User dictionary is not case sensitive.
      - text: All buttons in the "Word not found" groupbox will use the word in the "Word not found" textbox.
      - separator [ref=f1e331]
      - heading "Import/OCR image based subtitles - like DVD Sub/idx or Blu-ray sup" [level=2] [ref=f1e332]
      - text: "If you open an image based subtitle like Blu-ray sup or sub/idx (vobsub) this screen will come up:"
      - img "Import/ocr image based subtitles" [ref=f1e333]
      - text: "The list view now contains empty subtitle text lines with only timestamps. You can enter the text manually, but it's much easier to let one of the OCR engines do the work:"
      - list [ref=f1e334]:
        - listitem [ref=f1e335]:
          - text: "OCR via binary image compare (recommended): This option does not require any third party software installed, but it does require the user to manually enter letters based on image parts."
          - text: "\"No of pixels is space\" should be decreased if not all translated words are separated (like \"wearefine.\"), and increased if there are too many separations (like \"w e ar e fi n e.\")."
        - listitem [ref=f1e336]:
          - text: "OCR via Tesseract 3.02 (recommended):"
          - link "Tesseract" [ref=f1e337] [cursor=pointer]:
            - /url: https://github.com/tesseract-ocr/tesseract
          - text: is an open source OCR engine.
          - text: You can find additional language data files at
          - link "Github" [ref=f1e338] [cursor=pointer]:
            - /url: https://github.com/tesseract-ocr/tesseract/wiki/Data-Files#data-files-for-version-302
          - text: . These Tesseract dictionary files need to be unpacked to [Subtitle Edit folder]\Tesseract302\tessdata.
          - text: "If you right-click in the list view, you will get a context menu with these options:"
          - img "OCR list view context menu" [ref=f1e339]
          - generic [ref=f1e340]: Import text with matching time codes...
          - text: can be used to continue working on an earlier created subtitle.
          - generic [ref=f1e341]: Save subtitle image as...
          - text: allows for saving current image as either png, gif, bmp, or tiff.
          - generic [ref=f1e342]: Save all images with html index
          - text: display all subtitles images in an html page - for easy proofreading.
          - text: OCR via Tesseract will work best if you also have
          - link "spell check" [ref=f1e343] [cursor=pointer]:
            - /url: "#spellcheck"
          - text: dictionaries.
          - img "OCR dictionary" [ref=f1e344]
          - generic [ref=f1e345]: prompt for unknown words
          - text: and
          - generic [ref=f1e346]: Try to guess unknown words
          - text: will only work if a dictionary is available.
          - generic [ref=f1e347]: Fix OCR errors
          - text: will also benefit from a dictionary.
          - text: If you think Tesseract is too slow, you could set the spell check dictionary to "None" for better performance and then fix errors e.g. via "Fix common errors" plus spell check afterwards.
          - text: The
          - generic [ref=f1e348]: prompt for unknown words
          - text: "will look like this (window is re-sizable):"
          - img "OCR spell check" [ref=f1e349]
          - generic [ref=f1e350]: Edit whole text
          - text: will enable editing of the whole text (and not only the current word) - for this one sub only.
          - generic [ref=f1e351]: Change all / Use always
          - text: will change current word always - also in future works (saved in the OCR Fix Replace list - take a look at Dictionaries/eng_OCRFixReplaceList.xml to learn more about this file).
          - generic [ref=f1e352]: Change / Use
          - text: will change current word just this once.
          - generic [ref=f1e353]: Add to names/noise list (case sensitive)
          - text: will remember this name with current casing - also in future works.
          - generic [ref=f1e354]: Add to user dictionary
          - text: will remember this word and not prompt for it any more - also in future works.
        - listitem [ref=f1e355]:
          - text: "OCR via Tesseract 5 (recommended for text without italics or languages not available for Tesseract 3.02):"
          - link "Tesseract" [ref=f1e356] [cursor=pointer]:
            - /url: https://github.com/tesseract-ocr/tesseract
          - text: is an open source OCR engine.
          - text: You can find additional language data files at
          - link "Github" [ref=f1e357] [cursor=pointer]:
            - /url: https://github.com/tesseract-ocr/tesseract/wiki/Data-Files#updated-data-files-for-version-400-september-15-2017
          - text: . These Tesseract dictionary files need to be unpacked to [Subtitle Edit folder]\Tesseract4\tessdata.
          - text: Tesseract 5 uses a new OCR engine that uses neural network system based on LSTMs.
          - text: Note that Tesseract 5 is a bit slower and has limited support for detecting italic font style - but it does bring accuracy gains, especially for smaller/unclear fonts.
          - text: Note that Tesseract works best with black letters on a white background, or white letters on black background (try to avoid an outline).
          - text: You'll need to install
          - link "Visual C++ 2017 runtime" [ref=f1e358] [cursor=pointer]:
            - /url: https://aka.ms/vs/15/release/vc_redist.x86.exe
          - text: to run Tesseract 5 (otherwise SE will complain about a missing VCOMP140.dll file).
        - listitem [ref=f1e359]:
          - text: OCR via
          - link "nOCR" [ref=f1e361] [cursor=pointer]:
            - /url: /subtitleedit/nocr
          - text: (recommended for larger subtitles like Blu-ray .sup)
          - text: You can train nOCR with our own fonts fairly easy/quick.
        - listitem [ref=f1e362]:
          - text: OCR via
          - link "Paddle OCR" [ref=f1e364] [cursor=pointer]:
            - /url: https://github.com/PaddlePaddle/PaddleOCR
          - text: (recommended for Chinese/English/Japanese/Korean)
          - text: Even works well with complex images, e.g. from hard-coded subtitles.
          - text: "Read more:"
          - link "https://github.com/SubtitleEdit/subtitleedit/issues/9204" [ref=f1e365] [cursor=pointer]:
            - /url: https://github.com/SubtitleEdit/subtitleedit/issues/9204
      - text: Select one of the OCR methods and click on the button "Start OCR".
      - text: When you are done just click "OK" and do remember that an OCR'ed subtitle most likely contains some errors that need correction.
      - text: If a VobSub/TS subtitle contains more than one language, you will be prompted for language.
      - separator [ref=f1e366]
      - heading "Edit Blu-ray sup/TS-images/BdnXml image based subtitles" [level=2] [ref=f1e367]
      - paragraph [ref=f1e368]:
        - text: In File - Import - Blu-ray (.sup) subtitle file for edit it's possible to edit and re-save while keeping existing positions.
        - text: "You can change color/size/alpha/position/forced/sync/duration of lines/insert and even replace a whole image and much more:"
        - img "Edit Blu-ray sup screenshot" [ref=f1e369]
        - text: In the preview to the right, you can see subtitles in a black box (the black box only shows the size of the image).
        - text: The subtitle preview box can be moved with the mouse or via the position number up/down controls.
        - text: In File - Save as... you can save as Blu-ray sup or BdnXml.
      - separator [ref=f1e370]
      - heading "Settings" [level=2] [ref=f1e371]
      - paragraph [ref=f1e372]:
        - text: In Settings you can adjust how Subtitle Edit will behave, so it's pretty important to take a look at these settings - especially single line maximum length and maximum characters per second as these settings will be used throughout all functionality, like "Fix common error" and other tools like syntax coloring in the main window list view (see the "Syntax coloring" settings for adjustments).
        - img "Settings" [ref=f1e373]
        - text: The most important rules are grouped in a "Profile" - you can use the default, choose one of the pre-defined profiles, or define your own.
        - img "Settings - profiles" [ref=f1e374]
      - separator [ref=f1e375]
      - heading "Settings - Shortcuts" [level=2] [ref=f1e376]
      - text: "A few of the most important ones are:"
      - table [ref=f1e377]:
        - rowgroup [ref=f1e378]:
          - row "Window Control Shortcuts Function" [ref=f1e379]:
            - columnheader "Window" [ref=f1e380]
            - columnheader "Control" [ref=f1e381]
            - columnheader "Shortcuts" [ref=f1e382]
            - columnheader "Function" [ref=f1e383]
        - rowgroup [ref=f1e384]:
          - row "Main * Ctrl+F (customizable) Open the Find dialog" [ref=f1e385]:
            - cell "Main" [ref=f1e386]
            - cell "*" [ref=f1e387]
            - cell "Ctrl+F (customizable)" [ref=f1e388]
            - cell "Open the Find dialog" [ref=f1e389]
          - row "Main (customizable) * F3 Find next" [ref=f1e390]:
            - cell "Main (customizable)" [ref=f1e391]
            - cell "*" [ref=f1e392]
            - cell "F3" [ref=f1e393]
            - cell "Find next" [ref=f1e394]
          - row "Main * Ctrl+Z (customizable) Show history/undo" [ref=f1e395]:
            - cell "Main" [ref=f1e396]
            - cell "*" [ref=f1e397]
            - cell "Ctrl+Z (customizable)" [ref=f1e398]
            - cell "Show history/undo" [ref=f1e399]
          - row "Main * Ctrl+G (customizable) Go to subtitle number dialog" [ref=f1e400]:
            - cell "Main" [ref=f1e401]
            - cell "*" [ref=f1e402]
            - cell "Ctrl+G (customizable)" [ref=f1e403]
            - cell "Go to subtitle number dialog" [ref=f1e404]
          - row "Main * Alt+Arrow up Go one line up in subtitle list view" [ref=f1e405]:
            - cell "Main" [ref=f1e406]
            - cell "*" [ref=f1e407]
            - cell "Alt+Arrow up" [ref=f1e408]
            - cell "Go one line up in subtitle list view" [ref=f1e409]
          - row "Main * Alt+Arrow down Go one line down in subtitle list view" [ref=f1e410]:
            - cell "Main" [ref=f1e411]
            - cell "*" [ref=f1e412]
            - cell "Alt+Arrow down" [ref=f1e413]
            - cell "Go one line down in subtitle list view" [ref=f1e414]
          - row "Main Subtitle list view Ctrl+A Select all lines" [ref=f1e415]:
            - cell "Main" [ref=f1e416]
            - cell "Subtitle list view" [ref=f1e417]
            - cell "Ctrl+A" [ref=f1e418]
            - cell "Select all lines" [ref=f1e419]
      - link "Complete list of shortcuts!" [ref=f1e420] [cursor=pointer]:
        - /url: /subtitleedit/shortcuts
      - text: "Shortcuts are configurable via Options -> Settings -> Shortcuts (let me know if you need more):"
      - img "Configurable shortcuts" [ref=f1e421]
      - text: "Note: Shortcuts in menus has a stricter validation than hidden shortcuts (e.g. [Shift+N] is not allowed in a menu but is fine for a hidden shortcut)."
      - separator [ref=f1e422]
      - heading "Settings - Video player" [level=2] [ref=f1e423]
      - text: In the "Video player" section you can choose which video player to use inside SE.
      - img "Settings - video player" [ref=f1e424]
      - text: Currently "mpv" is recommended as it has precise seeking and on-video-preview.
      - text: Click on "Download mpv lib" to download and use "mpv".
      - generic [ref=f1e425]:
        - text: If you have problems downloading mpv via the download button, you can download the file directly from
        - link "GitHub" [ref=f1e426] [cursor=pointer]:
          - /url: https://github.com/SubtitleEdit/support-files/tree/master/mpv
        - text: .
        - text: Download the
        - link "libmpv2-64.zip" [ref=f1e427] [cursor=pointer]:
          - /url: https://github.com/SubtitleEdit/support-files/raw/master/mpv/libmpv2-64.zip
        - text: file if you have a 64-bit OS.
        - text: Unpack the zip file and copy "mpv-2.dll" to the SE data folder (press Ctrl+Shift+Alt+D in the SE main window to open the SE data folder).
        - text: "You can get cutting edge versions of mpv here:"
        - link "https://sourceforge.net/projects/mpv-player-windows/files/libmpv/" [ref=f1e428] [cursor=pointer]:
          - /url: https://sourceforge.net/projects/mpv-player-windows/files/libmpv/
      - separator [ref=f1e429]
      - heading "Settings - Tools" [level=2] [ref=f1e430]
      - text: "Here you can setup/tweak different tools:"
      - img "Settings - Font" [ref=f1e431]
      - text: If you often use "Fix common errors" and always use the same fix rules, then enable "Skip step one" to save time.
      - text: Often people want to customize line split, so many options are available for this incl. do-not-break-after list.
      - text: The "auto br" line split settings are used in "Fix common errors", the main window "Auto br" button, and the list view context menu "Auto balance selected lines".
      - text: Note that the "Auto br" button works on selected lines.
      - separator [ref=f1e432]
      - heading "Settings - Appearance" [level=2] [ref=f1e433]
      - text: Here you can set font and other UI properties for the SE interface.
      - img "Settings - Font" [ref=f1e434]
      - text: "Use syntax coloring will enable syntax coloring of html tags and optional spelling errors:"
      - img "Settings - Appearance - Text box syntax coloring" [ref=f1e435]
      - text: "Dark theme / Dark mode will switch color theme to something like this:"
      - img "Settings - Appearance - Dark theme" [ref=f1e436]
      - separator [ref=f1e437]
      - heading "Bookmarks" [level=2] [ref=f1e438]
      - text: You can add a bookmark for a line by activating one of the "Toggle bookmark" shortcuts (see Options - Settings - Shortcuts).
      - text: In the "Add bookmark with comment" window you can enter a comment to the bookmark (use Shift+Enter for more than one line).
      - text: Bookmarks are saved in a separate file. If you're working on "video.srt", then SE will save the bookmarks in a file called "Video.srt.SE.bookmarks", so you can actually email both files to other people using SE, and they can also see the bookmarks.
      - img "Bookmark" [ref=f1e439]
      - text: "Tip 1: You can right click on the bookmark image left of the text box to get a context menu."
      - text: "Tip 2: You can double click on the yellow text label to edit the text."
      - separator [ref=f1e440]
      - heading "Generate background box (for Advanced Sub Station Alpha)" [level=2] [ref=f1e441]
      - text: Generate a box with e.g. rounded corners behind the text.
      - text: It's also possible to add a drawing (logo/flag/etc.) to each background box or even instead of the box.
      - text: "Drawings can use a little scripting inside brackets ([]) with these constants which are calculated from current subtitle text: left, top, right, bottom, width, height"
      - text: "Example of coordinate: [left+width*0.9],[top+10]"
      - text: The preview will update if the drawing source file is changed, e.g. if you edit it in notepad.
      - text: "Important note: Background box should be made when finishing a subtitle. Box sizes will reflect the text at the time of generation!"
      - img "Generate background box" [ref=f1e442]
      - separator [ref=f1e443]
      - heading "Translating Subtitle Edit to another language" [level=2] [ref=f1e444]
      - text: To translate Subtitle Edit first download
      - link "the English xml language file" [ref=f1e445] [cursor=pointer]:
        - /url: https://raw.githubusercontent.com/SubtitleEdit/subtitleedit/main/LanguageBaseEnglish.xml
      - text: and save it to your "Subtitle Edit\Languages" folder. Translate the content of all tags with an xml editor or just notepad. You can also use
      - link "Xml Content Translator" [ref=f1e446] [cursor=pointer]:
        - /url: /XmlContentTranslator
      - text: "!"
      - text: Save your edited xml file as 'CultureName'.xml ('CultureName' must be an
      - link "existing culture name" [ref=f1e447] [cursor=pointer]:
        - /url: http://msdn.microsoft.com/en-us/library/system.globalization.cultureinfo%28v=vs.80%29.aspx
      - text: "- and also a tag in the xml file) in the SubtitleEdit\\Languages folder. In Options > Choose language, you can now test your translation by choosing your language as language."
      - text: Please do send any translations to me, so I can include them in Subtitle Edit - thx :)
      - text: "Tip 1:"
      - link "WinMerge" [ref=f1e448] [cursor=pointer]:
        - /url: http://winmerge.org
      - text: is an excellent tool for comparing files.
      - text: "Tip 2: In the About section you can put your email (with \"mailto:\" before to make a clickable link) or homepage."
      - text: "Tip 3: The help file tag can point to an url where the help is - keep it blank to just point to the English help file."
      - text: The installer can localized by translating
      - link "this file" [ref=f1e449] [cursor=pointer]:
        - /url: https://github.com/SubtitleEdit/subtitleedit/blob/main/installer/Subtitle_Edit_Localization.iss
      - text: .
      - separator [ref=f1e450]
      - heading "Networking - online collaboration" [level=2] [ref=f1e451]
      - text: If you and a few friends want to translate the same subtitle at the same time over the internet, then do try the "Networking" feature.
      - text: "First load the subtitle you want translated (and optionally the original subtitle). Then choose \"Start new session\" in the \"Networking\" menu:"
      - img "Start network session" [ref=f1e452]
      - text: The "session key" is your subtitle id (can be any text you like) - other people need this in order to join (via menu Networking -> Join session) your session.
      - text: The "username" will be displayed when updating/inserting/deleting lines and in the chat window
      - text: The "webservice url" points to a small server program hosting the session (I initially developed this via direct p2p, but decided to use a webservice instead, as it works much better with stuff like firewalls).
      - link "Source code for this webservice is available" [ref=f1e453] [cursor=pointer]:
        - /url: /assets/SubtitleEdit/SeNetworkingService.zip
      - text: and should make it easy to use your own server for hosting the networking session.
      - text: Subtitle Edit running in networking mode below. In the "User/action" column in the list view you can follow the translation progress - this might sparkle some synergistic effect!
      - img "Subtitle Edit running in networking mode" [ref=f1e454]
      - separator [ref=f1e455]
      - heading "Beautify time codes" [level=2] [ref=f1e456]
      - text: Beautify time codes can round time codes to frame time codes, and/or put cues on shot changes if they are near enough.
      - text: With ffprobe (in-program download) you can round time code milliseconds to frame time codes.
      - text: Snap to shot changes with advanced rules. Shot changes can be generated by ffmpeg (ffmpeg is an in-program download).
      - img "Beautify time codes UI" [ref=f1e457]
      - text: "The rules are very configurable, and can e.g. be configured to support Netflix rules:"
      - img "Beautify time codes UI" [ref=f1e458]
      - separator [ref=f1e459]
      - heading "Batch convert via UI" [level=2] [ref=f1e460]
      - text: Batch convert is accessible via Tools -> Batch convert... or you can start the batch convert directly via SubtitleEdit /batchconvertui
      - text: Batch convert is a powerful tool that can convert between 300 different subtitle formats with a lot of options.
      - text: Many formats can also be read from mkv/mp4/ts/m2ts files.
      - text: "Some of the batch convert options have their own settings, e.g. \"Merge short lines\". To show the settings for \"Merge short lines\", the list box line with the \"Merge short lines\" option should be selected like below (note: it's not enough to click on the check box, a click on the text is needed)."
      - text: Transport streams (.ts/.m2ts) can only be converted to Blu-ray sup files - check the TS settings if you want to resize or do re-positioning.
      - img "Batch convert UI" [ref=f1e461]
      - separator [ref=f1e462]
      - heading "Audio to text" [level=2] [ref=f1e463]
      - text: Audio to text (also called "speech to text" or "speech recognition") is accessible via Video -> Audio to text... or you can make a custom shortcut.
      - generic [ref=f1e464]: Audio to text (Whisper)
      - text: is a new experimental speech recognition framework that works on around 100 languages.
      - img "Audio to text" [ref=f1e465]
      - text: "You can use one of these Whisper versions:"
      - list [ref=f1e466]:
        - listitem [ref=f1e467]:
          - text: The original
          - link "OpenAI Whisper" [ref=f1e468] [cursor=pointer]:
            - /url: https://github.com/openai/whisper
          - text: (requires Python)
        - listitem [ref=f1e469]:
          - text: Purfview's
          - link "Faster-Whisper" [ref=f1e470] [cursor=pointer]:
            - /url: https://github.com/Purfview/whisper-standalone-win
          - text: (Windows only)
        - listitem [ref=f1e471]:
          - text: A simplified/optimized version called
          - link "whisper.cpp" [ref=f1e472] [cursor=pointer]:
            - /url: https://github.com/ggerganov/whisper.cpp
          - text: (written in C++)
        - listitem [ref=f1e473]:
          - text: A GPU optimized version of CPP with
          - link "cuBLAS support" [ref=f1e474] [cursor=pointer]:
            - /url: https://github.com/ggerganov/whisper.cpp
          - text: (written in C++)
        - listitem [ref=f1e475]:
          - text: A GPU optimized version called
          - link "Whisper Const-me" [ref=f1e476] [cursor=pointer]:
            - /url: https://github.com/Const-me/Whisper
          - text: (written in C++)
        - listitem [ref=f1e477]:
          - text: A optimized version called
          - link "Faster Whisper with CTranslate2" [ref=f1e478] [cursor=pointer]:
            - /url: https://github.com/jordimas/whisper-ctranslate2
          - text: (requires Python)
        - listitem [ref=f1e479]:
          - text: Another Python version called
          - link "stable-ts" [ref=f1e480] [cursor=pointer]:
            - /url: https://github.com/jianfch/stable-ts
          - text: (requires Python)
        - listitem [ref=f1e481]:
          - text: Another Python version called
          - link "whisperX" [ref=f1e482] [cursor=pointer]:
            - /url: https://github.com/m-bain/whisperX
          - text: (requires Python)
      - text: To install and run the OpenAI Python version, you will need to follow
      - link "the installation instructions" [ref=f1e483] [cursor=pointer]:
        - /url: https://github.com/openai/whisper#setup
      - text: .
      - text: Before installing Whisper Python versions, do
      - link "install Python" [ref=f1e484] [cursor=pointer]:
        - /url: https://www.python.org/ftp/python/3.10.11/python-3.10.11-amd64.exe
      - text: and remember to check "Add Python to PATH" and you also might need
      - link "Git" [ref=f1e485] [cursor=pointer]:
        - /url: https://gitforwindows.org/
      - text: too.
      - text: "Manual model download links for OpenAI Python version:"

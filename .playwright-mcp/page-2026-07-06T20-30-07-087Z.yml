        - text: When writing regular expressions grouping and backreferences are very useful. Parts of a regular expression inside parentheses are groups and can be referenced in the replace string where $1 is a reference to the first group and $2 is a reference to the second and so on.
        - table [ref=f1e188]:
          - 'row "Example 1: ^J( .+) + replace string ♪ $1 Only the starting \"J\" will be replaced, so if the text is \"J Music Playing J\" it will become \"♪ Music Playing J\"" [ref=f1e189]':
            - cell "Example 1:" [ref=f1e190]
            - cell "^J( .+) + replace string ♪ $1" [ref=f1e191]
            - cell "Only the starting \"J\" will be replaced, so if the text is \"J Music Playing J\" it will become \"♪ Music Playing J\"" [ref=f1e192]
          - 'row "Example 2: ([a-z]+)([0-9]+) + replace string $2$1 Two groupings that will be switched, so if the text is \"number26\" it will become \"26number\"." [ref=f1e193]':
            - cell "Example 2:" [ref=f1e194]
            - cell "([a-z]+)([0-9]+) + replace string $2$1" [ref=f1e195]
            - cell "Two groupings that will be switched, so if the text is \"number26\" it will become \"26number\"." [ref=f1e196]
          - 'row "Example 3: [.\\s\\S]*www.addsite.com[.\\s\\S]* + empty replace string Will remove any subtitles containing \"www.addsite.org\"" [ref=f1e197]':
            - cell "Example 3:" [ref=f1e198]
            - cell "[.\\s\\S]*www.addsite.com[.\\s\\S]* + empty replace string" [ref=f1e199]
            - cell "Will remove any subtitles containing \"www.addsite.org\"" [ref=f1e200]

      - heading "Video/wave form modes" [level=2] [ref=f1e220]
      - text: "When using video and/or wave form three different modes (tabs) are available: Translate, Create, and Adjust."
      - heading "Translate mode" [level=3] [ref=f1e221]
      - img "Translate mode" [ref=f1e222]
      - text: In translate mode you can translate a subtitle from one language to another manually (or correct a machine translated subtitle) while watching the video - and hearing the audio.
      - text: If "Auto repeat" is on, then the subtitle will be repeated x-times while you are typing in the correct text.
      - text: Use File -> Open original subtitle (translator mode) to also display the original text.
      - text: "Hint: Do use the <alt+arrow up/down> for going to previous/next subtitle."
      - heading "Create mode" [level=3] [ref=f1e223]
      - img "Create/adjust lines" [ref=f1e224]
      - text: This is the place to create subtitle lines from scratch or manually adjust existing lines.
      - text: To create subtitle lines from scratch, pause the video file where the subtitle line should start and press the button "Insert new subtitle at video pos". Then enter the text - duration is auto suggested. Now press the button "Play from just before text" and if the text does not start exactly when the speech starts, then adjust "Start time" via the up/down arrows until it does. The duration can be set via the button "Set end time" while the video is playing or via the "Duration up/down arrows.
      - text: To insert a subtitle right after the current line, press the Insert button (while the list view is focused).
      - text: You can also right click on the audio wave form or in the list view to insert/merge/split/delete lines.
      - heading "Adjust mode" [level=3] [ref=f1e225]
      - img "Adjust mode" [ref=f1e226]
      - text: This is the place to adjust existing lines.
      - text: To adjust subtitle lines manually one by one starting from the top. Use the buttons "Set start and offset the rest" (F9) and "Set end & go to next" (F10). Fine-tuning of "Start time" and "Duration" should be done by using the up/down arrows.
      - text: You can also right click on the audio wave form or in the list view to insert/merge/split/delete lines.
      - separator [ref=f1e227]
      - heading "Wave form" [level=2] [ref=f1e228]
      - text: The wave form control makes it easy to see exactly where speech starts/ends.
      - img "Wave form" [ref=f1e229]
      - text: With the right click menu, you can split/merge/delete subtitles.
      - img "Wave form - right click menu" [ref=f1e230]
      - text: To create a new paragraph, make a new selection with the mouse and press Enter
      - text: (or right click + choose "Add text here").
      - img "Wave form - new selection" [ref=f1e231]
      - heading "Wave form mouse/keys usage:" [level=3] [ref=f1e232]
      - list [ref=f1e233]:
        - listitem [ref=f1e234]: "Mouse single click: Go to position"
        - listitem [ref=f1e235]: "Mouse double click on existing subtitle: Select clicked subtitle"
        - listitem [ref=f1e236]: "Mark area + right click on marked area: Prompt for add new paragraph / play current selection"
        - listitem [ref=f1e237]: Mouse drag left/right border of subtitles (adjusting start or end time)
        - listitem [ref=f1e238]: Move/drag on middle of subtitle (adjusting both start and end time - but not duration)
        - listitem [ref=f1e239]: Mouse right click can either add new subtitle or perform delete/split/merge on existing subtitle line
        - listitem [ref=f1e240]: Mouse wheel scrolls waveform forward/back
        - listitem [ref=f1e241]: alt+arrow left/right moves video position
        - listitem [ref=f1e242]: alt+arrow up/down goes previous/next subtitle
        - listitem [ref=f1e243]: Numeric +/- will zoom in/out
        - listitem [ref=f1e244]: Mouse single click+Shift will set start for selected line (not moving end time)
        - listitem [ref=f1e245]: Mouse single click+Ctrl will set end for selected line (not moving start time)
        - listitem [ref=f1e246]: Mouse single click+Alt will set start for selected line (and keep duration)
        - listitem [ref=f1e247]: Mouse double click on non-paragraph - toggle play
        - listitem [ref=f1e248]: Mouse single click+Ctrl+Shift will set of start selected line + offset all lines after selected line (keeping durations)
        - listitem [ref=f1e249]:
          - text: Holding down ALT when moving start/end will move nearest subtitle start/end too if it's closer than 500 milliseconds -
          - link "like this." [ref=f1e250] [cursor=pointer]:
            - /url: /assets/SubtitleEdit/WaveformMoveNextPrev.gif
      - heading "Waveform extraction" [level=3] [ref=f1e251]
      - text: The extracting of wave data can be done with FFmpeg (configure in Options - Settings - Waveform) or
      - link "VLC" [ref=f1e252] [cursor=pointer]:
        - /url: https://www.videolan.org/
      - text: ", and then a very small wave file (with a VERY low sample rate) is generated and saved in the \"WaveForms\" folder."
      - text: "Note: You cannot use waveform without the video or the audio."
      - separator [ref=f1e253]
      - heading "Export" [level=2] [ref=f1e254]
      - text: Subtitle Edit can save via "Save as..." in many different text formats, but if you want to save a subtitle in a binary format (like pac or 890) or an image based format (like png or Blu-ray sup) you must use File -> Export.
      - text: Many settings like font, colors and also box style can be chosen.
      - text: "These tags are preserved when exporting a subtitle to an image based format:"
      - list [ref=f1e255]:
        - listitem [ref=f1e256]: i - for setting font to italic
        - listitem [ref=f1e257]: font color - for setting the font color
        - listitem [ref=f1e258]: "&123;\\an1&125;-&123;\\an9&125; - alignment tags"
        - listitem [ref=f1e259]: ASSA (Advanced Sub Station alpha) or SSA styles like color, font size and box (only ASSA has color alpha/translucency)
      - img "Export screenshot" [ref=f1e260]
      - text: "Note: Arabic might require \"Simple rendering\"."
      - text: "Note: SE requires TTS fonts, and does not support OTF font files."
      - separator [ref=f1e261]
      - heading "Synchronization" [level=2] [ref=f1e262]
      - table [ref=f1e263]:
        - row "Sync menu" [ref=f1e264]:
          - cell "Sync menu" [ref=f1e265]:
            - img "Sync menu" [ref=f1e266]
        - 'row "Subtitle Edit offers several ways to synchronize subtitles. Adjust all times (show earlier/later): This is useful if you for example need to show all texts 3 seconds earlier. Visual sync: Sync by matching start/end scene (more below). Point sync: This allows synchronization by using 2 or more points - sync point time codes can be entered manually which makes it easy to use time codes from another subtitle already in sync. Point sync via other subtitle: If you have another subtitle in sync (perhaps in another language - it helps if you can understand it a bit) you can match one of the first lines, match one of the last lines, sync, and then all lines should be in sync. Change frame rate: This makes it easy to match text from a video with one frame rate to a video with another frame rate (can also be done by visual sync or point sync)." [ref=f1e267]':

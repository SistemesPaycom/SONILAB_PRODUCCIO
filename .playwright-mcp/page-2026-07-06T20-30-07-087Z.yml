      - separator [ref=f1e118]
      - heading "Subtitle Edit main window" [level=2] [ref=f1e119]
      - heading "Menu in main window" [level=3] [ref=f1e120]
      - text: In the menu you can find many tools like change casing, split, append, spell check, synchronization, change frame rate, Google translate, find, replace, remove text for hearing impaired, and much more!
      - text: You can import subtitles from Blu-ray sup, transport streams, DVD, vobsub, text and images - even subtitles inside Matroska files can be imported.
      - img "Menu" [ref=f1e121]
      - text: "NOTE: Many tools are also available via right click in the list view."
      - generic [ref=f1e122]:
        - text: The toolbar can use external images. Create a folder called "Icons" (besides the "Dictionaries" and the "Waveforms" folder).
        - text: "Png files (32x32 pixels) with these names are used if exists: New, Open, Save, SaveAs, Find, Replace, FixCommonErrors, RemoveTextForHi, VisualSync, SpellCheck, Netflix, AssaStyle, AssaProperties, Settings, Help, WaveformToggle, VideoToggle"
      - heading "Subtitle/file formats" [level=3] [ref=f1e123]
      - table [ref=f1e124]:
        - row [ref=f1e125]:
          - cell [ref=f1e126]:
            - img "Subtitle format" [ref=f1e127]
            - text: In the top menu you can choose format and encoding. The first dropdown list shows subtitle formats. SubRip (extension is ".srt") is the most widely used format today, so it is recommended to save subtitles in this format.
            - text: Originally SubRip was a text only format, but in recent years html tags have been common. Especially the italic and font tags are widely used. For a list of SubRip support in players
            - link "check this out" [ref=f1e128] [cursor=pointer]:
              - /url: https://ale5000.altervista.org/subtitles.htm
            - text: .
            - text: File encoding is auto-detected in most cases. ANSI is the old, formerly the most common found format, but it requires your system to have a specific culture setting. UTF-8 is recommended for new subtitles, as it can handle non English letters better than ANSI (UTF-8 subtitles will work on all computers no matter what culture settings a computer has), and can display other symbols like music nodes. The only drawback of using UTF-8 is, that some older programs do not support UTF-8.
            - text: "If you have an ANSI file in another language than the current culture/language (or you have an invalid UTF/Unicode file) then you can use the menu item: File -> Import subtitle with manual chosen encoding."
            - text: "Import subtitle with manual chosen encoding with preview:"
            - img "ChooseEncoding" [ref=f1e129]
      - heading "Frame rate" [level=3] [ref=f1e130]
      - table [ref=f1e131]:
        - 'row "Frame rate Frame rate is not displayed by default, but you can enable it via the menu Options -> Settings: Toolbar: Show frame rate in toolbar. Frame rate is used when converting between subtitle formats based on frames and formats based on time. SubRip is based on time. MicroDvd (widely used 7-9 years ago, and still widely used in some countries) is based on frames. Subtitles based on time is preferred as videos may not have a constant frame rate - which makes working with subtitles based on frames not very flexible at all. To change the frame rate use Synchronization -> Change frame rate - or use one of the other synchronizations tools." [ref=f1e132]':

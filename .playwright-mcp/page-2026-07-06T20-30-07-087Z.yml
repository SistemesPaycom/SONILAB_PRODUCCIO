      - heading "Help/FAQ" [level=1] [ref=f1e68]
      - separator [ref=f1e69]
      - heading "Mini FAQ" [level=2] [ref=f1e70]
      - text: "Q: When I try to open a video in format \"...\", SE cannot play video or there's no sound. What do I do?"
      - text: "A: Try"
      - link "setting up MPV as your video player" [ref=f1e71] [cursor=pointer]:
        - /url: /subtitleedit/help#settings_video
      - text: .
      - text: Also be sure that you have
      - link "maximized the sound in SE" [ref=f1e72] [cursor=pointer]:
        - /url: /assets/SubtitleEdit/no_audio1.png
      - text: and
      - link "maximized the sound in Windows" [ref=f1e73] [cursor=pointer]:
        - /url: /assets/SubtitleEdit/no_audio2.png
      - text: .
      - text: "Q: Is it possible to move a subtitle to the top of the screen?"
      - text: "A: Yes, right-click on selected lines in the list view and choose Alignment..., and then choose e.g. Top center."
      - text: You will only see position changes in SE if you use "mpv" as video player - see Options -> Settings -> Video player .
      - text: "Note: Not all video players/converters will use this positioning."
      - text: "Q: Where is the delay tool?"
      - text: "A: Use Show earlier/later in the Synchronization menu. Shortcut is Ctrl+Shift+A. It's a tool window, so you can keep it open while working - or checking subtitle preview in video player."
      - text: "Q: Why can't Subtitle Edit change frame rate?"
      - text: "A: Well, it can. Check Synchronization -> Change frame rate."
      - text: "Q: Why can't Subtitle Edit split/append subtitles?"
      - text: "A: Try Tools -> Split/append."
      - text: "Q: Can Subtitle Edit offset times - but not from the very beginning?"
      - text: "A: Yes, you can work with a selection of subtitle lines. Select the lines in the list view you want to work on (hint: click on the first line, then shift+click on the last) and then right-click in the list view (context menu) - now you can adjust the selected lines in \"visual sync selected lines\" or just \"show selected lines earlier/later\"."
      - text: "Q: Can Subtitle Edit play video fullscreen?"
      - text: "A: Yes, press ALT+ENTER. Use space for play/pause and ALT+ARROW UP/DOWN for next/previous subtitle."
      - text: "Q: When translating/editing subtitles, can Subtitle Edit navigate quickly to next line?"
      - text: "A: Yes, press ALT+ARROW UP/DOWN for next previous subtitle - also textbox will keep focus."
      - text: "Q: Can Subtitle Edit add the subtitles to the video file?"
      - text: "A: There are two ways of adding subtitles into the video file - hardcoding (cannot be turned off ever, so this might be a bad idea) or embedding (only for some formats like mkv or mp4)."
      - text: SE can hardcode via the menu "Video" - "Generate video with burned-in subtitle" (requires FFmpeg).
      - text: SE can softcode via the menu "Video" - "Generate video with added/removed embedded subtitles" (requires FFmpeg).
      - text: Read more about
      - link "adding subtitles to video" [ref=f1e74] [cursor=pointer]:
        - /url: /subtitleedit/AddSubtitlesToVideo
      - text: or perhaps a tutorial called
      - link "Using Handbrake to Burn in Subtitles from MKV to MP4 for Apple TV" [ref=f1e75] [cursor=pointer]:
        - /url: https://www.epinionated.net/handbrake-burn-in-subtitles-mkv-mp4-apple-tv/
      - text: .
      - text: "Q: How to make a good GitHub issue?"
      - text: "A: Please add the following:"
      - list [ref=f1e76]:
        - listitem [ref=f1e77]: State where and what you were doing.
        - listitem [ref=f1e78]: Attach a screen shot (use e.g. Alt+PrtScr or Win+Shift+S, please just use copy-paste and no image hosts) + text also (you can copy the text from an error message box with Ctrl+C)
        - listitem [ref=f1e79]: Attach a subtitle (either whole or a sample, attach on GitHub as a .zip file)
        - listitem [ref=f1e80]: Check if the file "error_log.txt" contains useful information (and attach the file on GitHub if relevant)
        - listitem [ref=f1e81]: Only one bug/request/question in one GitHub issue

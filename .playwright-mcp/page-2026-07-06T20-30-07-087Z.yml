          - cell "Visual sync is a really easy way to synchronize a subtitle with a video file. Match one of the first subtitle lines with the start scene. Then match one of the last subtitle lines with the end scene. Press \"Sync!\" - and that's it :) There are a few helper buttons which will help find the right place in the video where the subtitle should start (just about where the first word comes out). The \"Play 1 sec and back\" button is a test button, so you can easily verify that the current position really is correct. Also check the Shortcuts. In some cases a subtitle is impossible to synchronize because one or more scenes have been removed/added. In these cases you can select a number of subtitles in the subtitle list view, right click and choose Visual sync selected lines. This way you can adjust the subtitle in smaller parts." [ref=f1e282]:
